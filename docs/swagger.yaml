openapi: 3.0.0
info:
  title: BudgetFlow API
  description: Personal budget management API for tracking income, expenses, and budgets
  version: 1.0.0
  contact:
    name: BudgetFlow Support
  license:
    name: MIT
servers:
- url: http://localhost:8080
  description: Development server
- url: https://api.budgetflow.com
  description: Production server
paths:
  /healthz:
    get:
      summary: Health check
      description: Returns the health status of the API
      tags:
      - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    post:
      summary: Register a new user
      description: Create a new user account with email and password
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: securepassword123
                name:
                  type: string
                  example: John Doe
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      summary: User login
      description: Authenticate user and receive JWT token
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securepassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for authenticated requests
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/forgot-password:
    post:
      summary: Request password reset
      description: Send password reset instructions to user email
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset instructions sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset instructions sent to email
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/password/reset:
    put:
      summary: Reset password
      description: Reset user password using reset token
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                  example: reset_token_123
                new_password:
                  type: string
                  format: password
                  minLength: 6
                  example: newpassword123
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully
        '400':
          description: Invalid token or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/me:
    get:
      summary: Get current user
      description: Retrieve the authenticated user's profile information
      tags:
      - User
      security:
      - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/budgets:
    get:
      summary: List all budgets
      description: Retrieve all budgets for the authenticated user
      tags:
      - Budgets
      security:
      - BearerAuth: []
      parameters:
      - name: category
        in: query
        description: Filter by category name
        schema:
          type: string
      responses:
        '200':
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new budget
      description: Create a new budget for a spending category
      tags:
      - Budgets
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - amount
              - category
              properties:
                name:
                  type: string
                  example: Groceries
                amount:
                  type: number
                  format: float
                  example: 500.0
                category:
                  type: string
                  example: Food
                color:
                  type: string
                  example: '#FF5733'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/budgets/{id}:
    put:
      summary: Update a budget
      description: Update an existing budget
      tags:
      - Budgets
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                amount:
                  type: number
                  format: float
                category:
                  type: string
                color:
                  type: string
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a budget
      description: Delete a budget and all associated data
      tags:
      - Budgets
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Budget deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/transactions:
    get:
      summary: List all transactions
      description: Retrieve all transactions for the authenticated user
      tags:
      - Transactions
      security:
      - BearerAuth: []
      parameters:
      - name: limit
        in: query
        description: Max number of items to return (1-200)
        schema:
          type: integer
          default: 100
      - name: offset
        in: query
        description: Offset for pagination
        schema:
          type: integer
          default: 0
      - name: month
        in: query
        description: Filter by month (YYYY-MM)
        schema:
          type: string
          example: 2026-09
      - name: start_date
        in: query
        description: Filter from start date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Filter to end date (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: type
        in: query
        description: Filter by transaction type
        schema:
          type: string
          enum:
          - income
          - expense
          - transfer
      - name: category_id
        in: query
        description: Filter by category ID
        schema:
          type: integer
      - name: account_id
        in: query
        description: Filter by account ID
        schema:
          type: integer
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new transaction
      description: Record a new income or expense transaction
      tags:
      - Transactions
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/transactions/{id}:
    put:
      summary: Update a transaction
      description: Update an existing transaction
      tags:
      - Transactions
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionInput'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a transaction
      description: Delete a transaction record
      tags:
      - Transactions
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Transaction deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get transaction details
      description: Retrieve full transaction detail including ledger movements and
        category mapping
      tags:
      - Transactions
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/summary:
    get:
      summary: Get financial summary
      description: Get a summary of income, expenses, and budget status
      tags:
      - Summary
      security:
      - BearerAuth: []
      parameters:
      - name: start_date
        in: query
        description: Start date for summary (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: End date for summary (YYYY-MM-DD)
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    get:
      summary: List all categories
      description: Retrieve all default and custom categories available to the authenticated
        user
      tags:
      - Categories
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts:
    get:
      summary: List all accounts
      description: Retrieve all accounts with their current balances for the authenticated
        user
      tags:
      - Accounts
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new account
      description: Create a new bank, mobile money, cash, or investment account
      tags:
      - Accounts
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountInput'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/accounts/{id}:
    put:
      summary: Update an account
      description: Update an account's name, type, account number, or currency
      tags:
      - Accounts
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountInput'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an account
      description: Delete an account and its associated balances and ledger history
      tags:
      - Accounts
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: account deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/transactions/income:
    post:
      summary: Record income transaction
      description: Records money entering an account, creating a double-entry debit
        ledger entry
      tags:
      - Transactions
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Income recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/transactions/expense:
    post:
      summary: Record expense transaction
      description: Records money leaving an account, creating a double-entry credit
        ledger entry
      tags:
      - Transactions
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Expense recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/transactions/transfer:
    post:
      summary: Record transfer transaction
      description: Records money moving between two accounts (2-sided ledger transaction)
      tags:
      - Transactions
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    User:
      type: object
      required:
      - id
      - email
      - name
      - created_at
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: John Doe
        created_at:
          type: string
          format: date-time
          example: '2024-08-11T10:30:00Z'
    Budget:
      type: object
      required:
      - id
      - user_id
      - account_id
      - category_id
      - category
      - name
      - amount
      - spent
      - created_at
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        account_id:
          type: integer
          example: 2
        category_id:
          type: integer
          example: 1
        category:
          type: string
          example: Food
        name:
          type: string
          example: Groceries
        amount:
          type: number
          format: float
          example: 500.0
        color:
          type: string
          example: '#FF5733'
        spent:
          type: number
          format: float
          example: 150.5
        created_at:
          type: string
          format: date-time
          example: '2024-08-11T10:30:00Z'
    Transaction:
      type: object
      required:
      - id
      - user_id
      - type
      - title
      - amount
      - date
      - created_at
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        type:
          type: string
          enum:
          - income
          - expense
          - transfer
          example: expense
        title:
          type: string
          example: Italian Restaurant
        amount:
          type: number
          format: float
          example: 3500.0
        category:
          type: string
          example: Dining
        category_id:
          type: integer
          nullable: true
          example: 1
        account_id:
          type: integer
          nullable: true
          example: 5
        account_name:
          type: string
          example: M-Pesa Wallet
        from_account_id:
          type: integer
          nullable: true
          example: 5
        from_account_name:
          type: string
          example: M-Pesa Wallet
        to_account_id:
          type: integer
          nullable: true
          example: 2
        to_account_name:
          type: string
          example: KCB Savings
        date:
          type: string
          format: date
          example: '2026-09-08'
        note:
          type: string
          example: Family dinner
        idempotency_key:
          type: string
          nullable: true
          example: uuid-123
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Summary:
      type: object
      required:
      - total_income
      - total_expenses
      - net_balance
      - budgets
      properties:
        total_income:
          type: number
          format: float
          example: 3000.0
        total_expenses:
          type: number
          format: float
          example: 1500.0
        net_balance:
          type: number
          format: float
          example: 1500.0
        budgets:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                example: Food
              budget_amount:
                type: number
                format: float
                example: 500.0
              spent:
                type: number
                format: float
                example: 350.0
              remaining:
                type: number
                format: float
                example: 150.0
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: validation error message
    Category:
      type: object
      required:
      - id
      - name
      - type
      - color
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          example: Dining
        type:
          type: string
          enum:
          - income
          - expense
          example: expense
        color:
          type: string
          example: '#6366f1'
        created_at:
          type: string
          format: date-time
    Account:
      type: object
      required:
      - id
      - user_id
      - name
      - type
      - balance
      - currency
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: M-Pesa Wallet
        type:
          type: string
          enum:
          - bank
          - cash
          - mobile_money
          - investment
          example: mobile_money
        account_number:
          type: string
          nullable: true
          example: 0712345678
        balance:
          type: number
          format: float
          example: 15000.0
        currency:
          type: string
          enum:
          - KES
          - USD
          - EUR
          - GBP
          example: KES
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAccountInput:
      type: object
      required:
      - name
      - type
      - currency
      properties:
        name:
          type: string
          example: KCB Savings
        type:
          type: string
          enum:
          - bank
          - cash
          - mobile_money
          - investment
          example: bank
        account_number:
          type: string
